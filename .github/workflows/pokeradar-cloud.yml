name: Web Availability Check

on:
  schedule:
    - cron: '*/5 * * * *'
  repository_dispatch:
  workflow_dispatch:

concurrency:
  group: pokeradar-titan-scan
  cancel-in-progress: false

jobs:
  check-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore Anti-Spam Memory
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: pokeradar-state-${{ github.run_number }}
          restore-keys: |
            pokeradar-state-

      - name: Install Cloud Browser (Playwright Firefox)
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps firefox

      - name: Run TITAN v4 Deep-Scan + AI Vision
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          cat << 'EOF' > scanner.mjs
          import fs from "fs";
          import crypto from "crypto";
          import { firefox } from "playwright";

          const MIN_PRICE = 45.0;
          const MAX_PRICE = 60.0;
          const WEBHOOK = process.env.DISCORD_WEBHOOK_URL || "";
          const GEMINI_KEY = process.env.GEMINI_API_KEY || "";
          const IS_MANUAL_TEST = process.env.EVENT_NAME === "workflow_dispatch";
          const STATE_FILE = "./state.json";
          const COOLDOWN_MS = 12 * 60 * 60 * 1000; // 12h anti-spam par alerte identique

          const decode = (b) => Buffer.from(b, "base64").toString("utf8");

          // Secteurs IRL anonymisés : reims, cormontreuil, laon, chambry + codes postaux 51100 / 02000
          const LOCAL_CITIES = decode("cmVpbXMsY29ybW9udHJldWlsLGxhb24sY2hhbWJyeQ==").split(",");
          const POSTAL_CODES = [decode("NTExMDA="), decode("MDIwMDA=")];

          // Pages locales Facebook & Instagram (Geek & Mystère) anonymisées
          const SOCIAL_TARGETS = [
            { name: decode("R2VlayAmIE15c3TDqHJlIChGYWNlYm9vayk="), url: decode("aHR0cHM6Ly93d3cuZmFjZWJvb2suY29tL2dlZWtldG15c3RlcmUv") },
            { name: decode("R2VlayAmIE15c3TDqHJlIChJbnN0YWdyYW0p"), url: decode("aHR0cHM6Ly93d3cuaW5zdGFncmFtLmNvbS9nZWVrZXRteXN0ZXJlLw==") }
          ];

          // Radars nationaux des vagues d'expédition Asmodee France
          const WAVE_NEWS_TARGETS = [
            { name: "Pokekalos (Actus Réassorts France)", url: "https://www.pokekalos.fr/" },
            { name: "Pokecardex (Actus Réassorts France)", url: "https://www.pokecardex.com/" }
          ];

          // Les 3 séries ciblées sur toutes les enseignes physiques du secteur
          const SERIES_LIST = [
            { id: "flammes", name: "ETB Flammes Fantasmagoriques", query: "Pokemon ETB Flammes Fantasmagoriques", kw: ["flammes fantasmagoriques", "flamme fantasmagorique"] },
            { id: "delta", name: "ETB Règne Delta", query: "Pokemon ETB Regne Delta", kw: ["règne delta", "regne delta"] },
            { id: "30ans", name: "ETB Pokémon 30 Ans", query: "Pokemon Coffret 30 ans", kw: ["30 ans", "30e anniversaire", "30ème anniversaire"] }
          ];

          const STORES = [
            { name: "Smyths Toys", tpl: "https://www.smythstoys.com/fr/fr-fr/search/?text={q}" },
            { name: "Cultura", tpl: "https://www.cultura.com/search/results?search_query={q}" },
            { name: "King Jouet", tpl: "https://www.king-jouet.com/jeux-jouets/recherche/resultats.htm?texte={q}" },
            { name: "JouéClub", tpl: "https://www.joueclub.fr/recherche?q={q}" },
            { name: "Fnac", tpl: "https://www.fnac.com/SearchResult/ResultList.aspx?Search={q}&sft=1&sa=0" },
            { name: "Micromania", tpl: "https://www.micromania.fr/on/demandware.store/Sites-Micromania-Site/default/Search-Show?q={q}" }
          ];

          function loadState() {
            try {
              if (fs.existsSync(STATE_FILE)) {
                const parsed = JSON.parse(fs.readFileSync(STATE_FILE, "utf8"));
                const now = Date.now();
                const cleanHashes = {};
                for (const [k, ts] of Object.entries(parsed.seenHashes || {})) {
                  if (now - ts < 7 * 24 * 60 * 60 * 1000) cleanHashes[k] = ts;
                }
                return { seenHashes: cleanHashes, knownUrls: parsed.knownUrls || [] };
              }
            } catch (e) {}
            return { seenHashes: {}, knownUrls: [] };
          }

          function saveState(st) {
            try {
              fs.writeFileSync(STATE_FILE, JSON.stringify(st, null, 2), "utf8");
            } catch (e) {}
          }

          function makeHash(str) {
            return crypto.createHash("sha1").update(String(str)).digest("hex").slice(0, 16);
          }

          function wasRecentlySent(state, key, cooldown = COOLDOWN_MS) {
            const h = makeHash(key);
            const last = state.seenHashes[h];
            if (last && Date.now() - last < cooldown) return true;
            return false;
          }

          function markSent(state, key) {
            state.seenHashes[makeHash(key)] = Date.now();
          }

          async function sendDiscord(content, embed, pngBuffer = null) {
            if (!WEBHOOK) return;
            try {
              if (pngBuffer) {
                const form = new FormData();
                const fullEmbed = { ...embed, image: { url: "attachment://capture.png" } };
                form.append("payload_json", JSON.stringify({
                  username: "PokéRadar TITAN v4 (IRL & IA)",
                  content,
                  embeds: [fullEmbed]
                }));
                form.append("files[0]", new Blob([pngBuffer], { type: "image/png" }), "capture.png");
                const r = await fetch(WEBHOOK, { method: "POST", body: form });
                if (r.ok) return;
              }
              await fetch(WEBHOOK, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  username: "PokéRadar TITAN v4 (IRL & IA)",
                  content,
                  embeds: embed ? [embed] : []
                })
              });
            } catch (e) {}
          }

          async function askGeminiJSON(promptText, base64Png = null) {
            if (!GEMINI_KEY) return null;
            try {
              const parts = [{ text: promptText }];
              if (base64Png) {
                parts.push({ inlineData: { mimeType: "image/png", data: base64Png } });
              }
              const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  contents: [{ parts }],
                  generationConfig: { responseMimeType: "application/json" }
                })
              });
              if (!resp.ok) return null;
              const data = await resp.json();
              const raw = (data?.candidates?.[0]?.content?.parts?.[0]?.text || "{}").replace(/```json|```/g, "").trim();
              return JSON.parse(raw);
            } catch (e) {
              return null;
            }
          }

          async function dismissPopups(page) {
            const selectors = [
              "#onetrust-accept-btn-handler",
              "#didomi-notice-agree-button",
              "button[aria-label='Fermer']",
              "div[aria-label='Fermer']",
              "button[aria-label='Close']",
              "div[role='button'][aria-label='Fermer']"
            ];
            for (const sel of selectors) {
              try {
                const el = page.locator(sel).first();
                if (await el.isVisible({ timeout: 400 })) {
                  await el.click({ timeout: 600 });
                  await page.waitForTimeout(300);
                }
              } catch (e) {}
            }
          }

          async function probeStoreModalIfPresent(page) {
            const triggers = [
              "text=/disponibilité en magasin/i",
              "text=/vérifier le stock en magasin/i",
              "text=/choisir un magasin/i",
              "text=/retrait en magasin/i"
            ];
            for (const trig of triggers) {
              try {
                const btn = page.locator(trig).first();
                if (await btn.isVisible({ timeout: 500 })) {
                  await btn.click({ timeout: 1000 });
                  await page.waitForTimeout(800);
                  const input = page.locator("input[placeholder*='postal' i], input[placeholder*='ville' i], input[name*='zip' i], input[type='search']").first();
                  if (await input.isVisible({ timeout: 600 })) {
                    await input.fill(POSTAL_CODES[0]);
                    await input.press("Enter");
                    await page.waitForTimeout(1200);
                  }
                  break;
                }
              } catch (e) {}
            }
          }

          async function inspectProductPage(page, state, serie, storeName, productUrl) {
            let sentCount = 0;
            try {
              await page.goto(productUrl, { waitUntil: "domcontentloaded", timeout: 18000 });
              await page.waitForTimeout(1400);
              await dismissPopups(page);

              // 1. Détection "EARLY LINK" (Nouvelle fiche produit créée en avance dans le catalogue !)
              const isFirstRunEver = state.knownUrls.length === 0;
              if (!state.knownUrls.includes(productUrl)) {
                state.knownUrls.push(productUrl);
                if (!isFirstRunEver && !wasRecentlySent(state, "early|" + productUrl, 7 * 24 * 3600 * 1000)) {
                  const titleText = await page.title();
                  const aiEarly = await askGeminiJSON(
                    `Titre de la page sur ${storeName}: "${titleText}" (${productUrl}). Confirme en JSON {"valid": true/false} si cette fiche produit est bien un Coffret Dresseur d'Élite / ETB Pokémon de la série "${serie.name}".`
                  );
                  if (!aiEarly || aiEarly.valid === true) {
                    const shot = await page.screenshot({ fullPage: false });
                    markSent(state, "early|" + productUrl);
                    sentCount++;
                    await sendDiscord(
                      `@everyone 🆕 **EARLY LINK DÉTECTÉ : ${storeName} vient de créer la fiche ${serie.name} !**`,
                      {
                        title: `🔗 Nouvelle fiche détectée en avance — ${storeName}`,
                        url: productUrl,
                        description: `La fiche officielle vient d'apparaître dans la base de **${storeName}** ! Le robot la surveille désormais en direct.\n👉 **[VOIR LA FICHE PRODUIT](${productUrl})**`,
                        color: 3447003
                      },
                      shot
                    );
                  }
                }
              }

              // 2. Essaie d'ouvrir le volet de stock magasin local (51100 / 02000)
              await probeStoreModalIfPresent(page);

              const pageData = await page.evaluate(({ cities, minP, maxP }) => {
                const visible = (document.body ? document.body.innerText : "").toLowerCase();
                const scriptsText = Array.from(document.querySelectorAll("script[type='application/ld+json'], script#__NEXT_DATA__"))
                  .map(s => s.textContent || "")
                  .join(" ")
                  .toLowerCase();
                const combined = visible + " " + scriptsText;

                // Extraction prix valide entre 45€ et 60€
                const priceRegex = /(\d{2})[,.](\d{2})\s*(?:€|eur)/gi;
                const prices = [];
                let m;
                while ((m = priceRegex.exec(visible)) !== null) {
                  const v = parseFloat(m[1] + "." + m[2]);
                  if (v >= minP && v <= maxP) prices.push(v);
                }
                const bestPrice = prices.length ? Math.min(...prices) : null;

                // Recherche Date Prédictive de retour en stock (J-3 à J-7)
                const predMatch = visible.match(/(attendu en stock[^.\n]{0,55}|retour en stock prévu[^.\n]{0,55}|en cours de réapprovisionnement[^.\n]{0,45}|disponible à partir du\s*\d{1,2}[\/.-]\d{1,2}[\/.-]?\d{0,4}|livraison prévue[^.\n]{0,45})/i);

                // Recherche Stock Magasin IRL (Reims, Cormontreuil, Laon, Chambry)
                let matchedCity = null;
                for (const c of cities) {
                  const posRegex = new RegExp("(en stock[^.\\n]{0,45}" + c + "|" + c + "[^.\\n]{0,45}(?:en stock|disponible|retrait 1h|retrait 2h|[1-9]\\d*\\s*en stock))", "i");
                  const negRegex = new RegExp("(rupture[^.\\n]{0,35}" + c + "|indisponible[^.\\n]{0,35}" + c + "|" + c + "[^.\\n]{0,35}(?:rupture|indisponible|épuisé|epuise|0 en stock))", "i");
                  if (posRegex.test(combined) && !negRegex.test(combined)) {
                    matchedCity = c.toUpperCase();
                    break;
                  }
                }

                return {
                  bestPrice,
                  predictiveEta: predMatch ? predMatch[1].trim() : null,
                  matchedCity,
                  snippet: visible.replace(/\s+/g, " ").slice(0, 900)
                };
              }, { cities: LOCAL_CITIES, minP: MIN_PRICE, maxP: MAX_PRICE });

              // Alerte Stock Magasin IRL
              if (pageData.matchedCity && pageData.bestPrice !== null) {
                const alertKey = `irl|${productUrl}|${pageData.matchedCity}`;
                if (!wasRecentlySent(state, alertKey)) {
                  const shot = await page.screenshot({ fullPage: false });
                  const aiConfirm = await askGeminiJSON(
                    `Regarde cette capture et cet extrait de la fiche produit sur ${storeName} : "${pageData.snippet}". Confirme en JSON {"valid": true/false} si c'est bien l'ETB / Coffret Dresseur d'Élite "${serie.name}" entre 45€ et 60€ et qu'il y a du stock disponible dans le magasin de "${pageData.matchedCity}".`,
                    shot.toString("base64")
                  );
                  if (!aiConfirm || aiConfirm.valid === true) {
                    markSent(state, alertKey);
                    sentCount++;
                    await sendDiscord(
                      `@everyone 🚨 **STOCK MAGASIN IRL (${pageData.matchedCity}) : ${serie.name} à ${pageData.bestPrice.toFixed(2)} € chez ${storeName} !**`,
                      {
                        title: `🏬 DISPONIBLE EN MAGASIN : ${pageData.matchedCity} (${storeName})`,
                        url: productUrl,
                        description: `**Produit :** ${serie.name}\n**Prix :** ${pageData.bestPrice.toFixed(2)} € (MSRP validé)\n**Magasin :** ${pageData.matchedCity}\n👉 **[OUVRIR LA FICHE PRODUIT EXACTE](${productUrl})**`,
                        color: 1081344
                      },
                      shot
                    );
                  }
                }
              }

              // Alerte Date Prédictive de Restock (J-5)
              if (pageData.predictiveEta) {
                const predKey = `pred|${productUrl}|${pageData.predictiveEta}`;
                if (!wasRecentlySent(state, predKey, 48 * 3600 * 1000)) {
                  const shot = await page.screenshot({ fullPage: false });
                  const aiPred = await askGeminiJSON(
                    `Extrait de la fiche ${serie.name} chez ${storeName} : "${pageData.snippet}". Confirme en JSON {"valid": true/false} si "${pageData.predictiveEta}" annonce bien une date de prochain retour en stock ou réapprovisionnement pour ce coffret.`,
                    shot.toString("base64")
                  );
                  if (!aiPred || aiPred.valid === true) {
                    markSent(state, predKey);
                    sentCount++;
                    await sendDiscord(
                      `@everyone 🔮 **DATE DE RESTOCK PROGRAMMÉE EN AVANCE : ${serie.name} chez ${storeName} !**`,
                      {
                        title: `📅 Réassort en approche — ${storeName}`,
                        url: productUrl,
                        description: `Le système de **${storeName}** affiche une date d'arrivée des stocks :\n> **\`${pageData.predictiveEta}\`**\n👉 **[VOIR LA FICHE PRODUIT](${productUrl})**`,
                        color: 10181046
                      },
                      shot
                    );
                  }
                }
              }
            } catch (e) {}
            return sentCount;
          }

          async function main() {
            const state = loadState();
            const browser = await firefox.launch({ headless: true });
            const context = await browser.newContext({
              locale: "fr-FR",
              viewport: { width: 1366, height: 900 },
              userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0"
            });
            const page = await context.newPage();
            let totalAlerts = 0;

            // =========================================================================
            // ÉTAGE 1 & 2 : RECHERCHE PUIS ENTRÉE DANS LES VRAIES FICHES PRODUITS ETB
            // =========================================================================
            for (const serie of SERIES_LIST) {
              for (const store of STORES) {
                const searchUrl = store.tpl.replace("{q}", encodeURIComponent(serie.query));
                try {
                  await page.goto(searchUrl, { waitUntil: "domcontentloaded", timeout: 16000 });
                  await page.waitForTimeout(1200);
                  await dismissPopups(page);

                  // Trouve les liens exacts des vraies fiches ETB de cette série (max 2 fiches par boutique)
                  const candidateLinks = await page.evaluate(({ kw }) => {
                    const etbWords = ["coffret dresseur", "dresseur d'élite", "dresseur d'elite", "etb", "elite trainer"];
                    const anchors = Array.from(document.querySelectorAll("a[href]"));
                    const found = [];
                    for (const a of anchors) {
                      const card = a.closest("article, .Article-item, .product-tile, .product-card, .js-product-tile, li.product") || a;
                      const txt = ((card.innerText || "") + " " + (a.getAttribute("title") || "")).toLowerCase();
                      if (txt.length > 1500) continue;
                      if (kw.some(k => txt.includes(k)) && etbWords.some(w => txt.includes(w))) {
                        const href = a.href;
                        if (href && href.startsWith("http") && !href.includes("/search") && !href.includes("recherche") && !found.includes(href)) {
                          found.push(href);
                        }
                      }
                      if (found.length >= 2) break;
                    }
                    return found;
                  }, { kw: serie.kw });

                  for (const prodLink of candidateLinks) {
                    totalAlerts += await inspectProductPage(page, state, serie, store.name, prodLink);
                  }
                } catch (e) {}
              }
            }

            // =========================================================================
            // ÉTAGE 3 : GEEK & MYSTÈRE LAON (ANTI-POPUP META + SCREENSHOT HD + IA VISION)
            // =========================================================================
            for (const s of SOCIAL_TARGETS) {
              try {
                await page.goto(s.url, { waitUntil: "domcontentloaded", timeout: 18000 });
                await page.waitForTimeout(2200);
                await dismissPopups(page);
                await page.keyboard.press("Escape").catch(() => {});
                await page.waitForTimeout(600);

                const feedText = (await page.evaluate(() => document.body ? document.body.innerText : "")).slice(0, 2500);
                const shot = await page.screenshot({ fullPage: false });

                const aiSocial = await askGeminiJSON(
                  `Tu surveilles les publications Facebook/Instagram de la boutique Geek & Mystère à Laon. Regarde attentivement cette capture d'écran (texte ET images des posts) ainsi que le texte extrait : "${feedText}".
                  Réponds UNIQUEMENT en JSON strict :
                  {"isRecentPokemonPost": true/false, "postSignature": "5 à 8 mots uniques identifiant ce post précis", "summary": "Résumé clair de ce que la boutique annonce"}
                  Mets isRecentPokemonPost à true UNIQUEMENT si un post récent (d'aujourd'hui / moins de 24h) annonce un arrivage, restock, précommande ou disponibilité en boutique de produits Pokémon (surtout ETB, Flammes Fantasmagoriques, Règne Delta, 30 ans, boosters ou coffrets). Ignore la bio générale de la boutique.`,
                  shot.toString("base64")
                );

                if (aiSocial && aiSocial.isRecentPokemonPost && aiSocial.postSignature) {
                  const socialKey = `geek|${aiSocial.postSignature.toLowerCase().trim()}`;
                  if (!wasRecentlySent(state, socialKey, 72 * 3600 * 1000)) {
                    markSent(state, socialKey);
                    totalAlerts++;
                    await sendDiscord(
                      `@everyone 🚨 **NOUVEAU POST POKÉMON CHEZ GEEK & MYSTÈRE LAON DÉTECTÉ PAR L'IA !**`,
                      {
                        title: `📸 ${s.name} — Arrivage / Annonce détectée`,
                        url: s.url,
                        description: `**Ce que l'IA Vision a lu sur le post / la photo :**\n> ${aiSocial.summary}\n\n👉 **[OUVRIR LA PAGE MAINTENANT](${s.url})**`,
                        color: 15418782
                      },
                      shot
                    );
                  }
                }
              } catch (e) {}
            }

            // =========================================================================
            // ÉTAGE 4 : RADAR NATIONAL DES VAGUES D'EXPÉDITION ASMODEE FRANCE (J-3)
            // =========================================================================
            for (const w of WAVE_NEWS_TARGETS) {
              try {
                await page.goto(w.url, { waitUntil: "domcontentloaded", timeout: 15000 });
                await page.waitForTimeout(1000);
                await dismissPopups(page);
                const newsText = (await page.evaluate(() => document.body ? document.body.innerText : "")).slice(0, 3000);
                if (/réassort|reassort|restock|vague|flammes fantasmagoriques|règne delta|30 ans/i.test(newsText)) {
                  const waveAI = await askGeminiJSON(
                    `Analyse ces titres d'actualités Pokémon France (${w.name}) : "${newsText}". Réponds UNIQUEMENT en JSON {"isWave": true/false, "waveId": "titre court unique", "summary": "..."} si une nouvelle vague de réassort / restock en magasin en France est annoncée très récemment pour des coffrets/ETB Pokémon (notamment Flammes Fantasmagoriques, Règne Delta ou 30 Ans).`
                  );
                  if (waveAI && waveAI.isWave && waveAI.waveId) {
                    const waveKey = `wave|${waveAI.waveId.toLowerCase().trim()}`;
                    if (!wasRecentlySent(state, waveKey, 7 * 24 * 3600 * 1000)) {
                      markSent(state, waveKey);
                      totalAlerts++;
                      await sendDiscord(
                        `@everyone 🔮 **ALERTE VAGUE DE RÉASSORT NATIONALE EN FRANCE !**`,
                        {
                          title: `🚚 ${w.name} — Réassort Asmodee en approche`,
                          url: w.url,
                          description: `**Info détectée :**\n> ${waveAI.summary}\n\n*(Prépare-toi : les magasins de Reims, Cormontreuil, Laon et Chambry reçoivent généralement leurs cartons 24h à 72h après cette annonce !)*`,
                          color: 10181046
                        }
                      );
                    }
                  }
                }
              } catch (e) {}
            }

            await browser.close();
            saveState(state);

            if (IS_MANUAL_TEST && WEBHOOK) {
              await sendDiscord(
                `✅ **POKÉRADAR TITAN v4.0 (Édition Ultime Anti-PokéCop) OPÉRATIONNEL !**`,
                {
                  title: `🛡️ Deep-Scan + IA Vision + Photos Discord + Mémoire Anti-Spam actifs`,
                  description:
                    `Bilan de ce scan de contrôle : **${totalAlerts} nouvelle(s) alerte(s)**.\n` +
                    `Fiches ETB mémorisées : **${state.knownUrls.length}**.\n\n` +
                    `**Ce qui tourne désormais 24h/24 (PC éteint) :**\n` +
                    `• 🔍 **Ouverture des vraies fiches produits** + test codes postaux locaux\n` +
                    `• 🆕 **Détecteur Early Links** (nouvelles fiches créées en avance)\n` +
                    `• 🔮 **Dates prédictives de restock (J-5)** & Vagues Asmodee France\n` +
                    `• 📸 **Geek & Mystère Laon** (fermeture popups Meta + Screenshot envoyé à l'IA)\n` +
                    `• 🖼️ **Preuve photo PNG** jointe directement dans tes alertes Discord\n` +
                    `• 🧠 **Mémoire Anti-Spam** (1 seule sonnerie par nouveauté)`,
                  color: 1081344
                }
              );
            }
          }

          main();
          EOF
          node scanner.mjs

      - name: Save Anti-Spam Memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: pokeradar-state-${{ github.run_number }}
